[project]
name = "valkyria-cli"
version = "0.1.0"
description = "Terminal-first, multi-model AI agent with local retrieval, controlled system access, and durable sessions"
readme = "readme.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Anupam" },
]

dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "cryptography>=50.0.2",
    "argon2-cffi>=25.1.0",
    "pinecone>=10.3.0",
    "python-dotenv>=1.2.4",
    "langchain-community>=0.4.2",
    "ddgs>=9.16.1",
    "langchain-core>=1.8.4",
]

[project.scripts]
valkyrie = "valkyrie.cli.main:cli"
vk = "valkyrie.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/valkyrie"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["valkyrie"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[tool.hatch.build.targets.sdist]
exclude = [
    "client",
    "dist",
    ".venv",
    "assets",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
